<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arrow Rush — Elevate Apps Inc</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fdf8f2;
      color: #2d2013;
      line-height: 1.7;
      padding: 0 16px 60px;
    }
    header {
      background: linear-gradient(135deg, #ce8b3a 0%, #b05c2a 100%);
      color: #fff;
      text-align: center;
      padding: 64px 24px 48px;
      margin: 0 -16px 40px;
    }
    header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    header p {
      margin-top: 12px;
      font-size: 1.05rem;
      opacity: 0.9;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      text-align: center;
    }
    .logo {
      width: 160px;
      height: auto;
      margin-bottom: 24px;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(176, 92, 42, 0.25);
    }
    .tagline {
      font-size: 1.1rem;
      color: #5a3010;
      margin-bottom: 40px;
    }
    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      margin-bottom: 48px;
    }
    .card {
      background: #fff;
      border: 1px solid #e8d8c4;
      border-radius: 12px;
      padding: 28px 32px;
      width: 280px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(176, 92, 42, 0.18);
    }
    .card h3 {
      font-size: 1.15rem;
      color: #b05c2a;
      margin-bottom: 8px;
    }
    .card p {
      font-size: 0.92rem;
      color: #7a5a3a;
    }
    footer {
      text-align: center;
      font-size: 0.85rem;
      color: #9e8060;
      margin-top: 40px;
    }
    footer a {
      color: #b05c2a;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Arrow Rush</h1>
    <p>A minimalist logic puzzle game by Elevate Apps Inc</p>
  </header>

  <div class="container">
    <img src="Assets/App%20Logo.png" alt="Arrow Rush Logo" class="logo" />
    <p class="tagline">456 handcrafted levels. Zero filler.</p>

    <div class="cards">
      <a href="legal/terms.html" class="card">
        <h3>Terms of Service</h3>
        <p>Read our terms and conditions</p>
      </a>
      <a href="legal/privacy.html" class="card">
        <h3>Privacy Policy</h3>
        <p>Learn how we handle your data</p>
      </a>
    </div>
  </div>

  <footer>
    <p>© 2025 Elevate Apps Inc. All rights reserved.</p>
  </footer>
</body>
</html>
